# This file configures the analyzer, which statically analyzes Dart code to
# check for errors, warnings, and lints.
#
# The issues identified by the analyzer are surfaced in the UI of Dart-enabled
# IDEs (Dart-Code). The analyzer can also be
# invoked from the command line by running `flutter analyze`.

# The following line activates a set of recommended lints for Flutter apps,
# packages, and plugins designed to encourage good coding practices.
include: package:flutter_lints/flutter.yaml

analyzer:
  # packages/fluttertoast/ คือ copy ที่ vendor ไว้ (v8.2.5) ไม่ได้ใช้แล้ว —
  # pubspec.lock resolve fluttertoast 9.0.0 จาก pub.dev แทน ถ้าไม่ exclude
  # analyzer จะสแกนซ้ำและรายงาน lint ของ third-party ปนเข้ามาในผลของโปรเจกต์
  exclude:
    - packages/**

  errors:
    # Flutter 3.38 deprecate withOpacity / MaterialStateProperty ทั้งโปรเจกต์
    # ตั้งเป็น ignore เพื่อไม่ให้ท่วมผล — ค่อยไล่ migrate ทีหลังเป็นงานแยก
    deprecated_member_use: ignore

linter:
  # ปิดเฉพาะ lint สไตล์ที่ขัดกับ convention ของ codebase นี้ (โค้ดเดิมเขียนแบบนี้
  # มาก่อนและตั้งใจ) — ที่เหลือเปิดไว้ตาม flutter_lints เพื่อให้ยังจับของจริงได้
  #
  # หมายเหตุ: `dart fix --apply` จะไม่แตะ rule ที่ปิดไว้ข้างล่างนี้ ถ้าต้องการ
  # ล้างพวกนี้ทีหลังให้เปิดชั่วคราวแล้วรัน dart fix (ดูตัวที่ mark "dart fix ได้")
  rules:
    # --- ชื่อ identifier สะท้อน key ของ JSON จาก API ห้าม rename ---
    # c_pvat, c_nvat, ser_in, docno_in, unit_con, total_sum, user_name ฯลฯ
    # เปลี่ยนชื่อแล้ว map กับ response ไม่ตรง
    non_constant_identifier_names: false
    constant_identifier_names: false

    # --- ชื่อไฟล์เดิมเป็น PascalCase/ผสม (GetCustomer_Model.dart, pay_Model.dart)
    # --- เปลี่ยนชื่อต้องไล่แก้ import ทุกที่ เสี่ยงเกินประโยชน์
    file_names: false

    # --- โมเดลที่ generate มา ประกาศ field ไม่ระบุ type ---
    prefer_typing_uninitialized_variables: false
    strict_top_level_inference: false

    # --- print ใช้เป็น diagnostic บน web โดยตั้งใจ (main.dart ปิด hook เอง) ---
    avoid_print: false

    # --- catch ว่างโดยตั้งใจ (fire-and-forget ตอน startup / cleanup) ---
    empty_catches: false

    # --- สไตล์ล้วน ไม่ได้บ่งชี้ bug ---
    prefer_is_empty: false
    prefer_is_not_empty: false
    unnecessary_string_interpolations: false
    annotate_overrides: false

    # --- dart fix ได้ (เปิดชั่วคราวถ้าจะรัน dart fix ทีหลัง) ---
    unnecessary_this: false # dart fix ได้
    unnecessary_new: false # dart fix ได้
    prefer_collection_literals: false # dart fix ได้

    # --- widget เก่าเขียนด้วย Container/SizedBox สลับกัน + ไม่ได้ใส่ key ---
    sized_box_for_whitespace: false
    avoid_unnecessary_containers: false
    unnecessary_const: false
    use_key_in_widget_constructors: false
    prefer_const_constructors_in_immutables: false

    # --- async gap มีอยู่ทั่วโปรเจกต์ (await แล้วใช้ context) ---
    use_build_context_synchronously: false

    # --- pattern createState() คืน State<X> แบบเดิม ---
    library_private_types_in_public_api: false
    no_leading_underscores_for_local_identifiers: false

    # --- if บรรทัดเดียวไม่ใส่ {} ใช้ทั่วโปรเจกต์ ---
    curly_braces_in_flow_control_structures: false

# Additional information about this file can be found at
# https://dart.dev/guides/language/analysis-options
