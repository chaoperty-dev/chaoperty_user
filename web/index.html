  <!-- This script adds the flutter initialization JS code -->

  <!-- PDF.js - served locally for iOS Lockdown Mode compatibility.
       Previously loaded from cdnjs.cloudflare.com which Lockdown Mode blocks. -->
  <script src="pdf.min.js"></script>
  <script type="text/javascript">
    pdfjsLib.GlobalWorkerOptions.workerSrc = "pdf.worker.min.js";
  </script>

  <!-- Security & Optimization (Production Only) -->
  <script>
    (function () {
      // ใช้บน host ที่ไม่ใช่ localhost / 127.0.0.1 (Production)
      var isProd =
        location.hostname !== 'localhost' &&
        location.hostname !== '127.0.0.1';

      if (!isProd) {
        return; // dev mode ไม่ต้องบล็อคอะไร
      }

      // บล็อคคีย์ลัด DevTools บางชุด
      document.addEventListener('keydown', function (e) {
        // normalize key (รองรับทั้ง keyCode กับ key ปกติ)
        var key = e.key || e.keyCode;

        // F12 / F5
        if (key === 'F5' || key === 'F12' || key === 123) {
          e.preventDefault();
          return false;
        }

        // Ctrl+Shift+I / Ctrl+Shift+J
        if (e.ctrlKey && e.shiftKey && (key === 'I' || key === 'J' || key === 73 || key === 74)) {
          e.preventDefault();
          return false;
        }

        // Ctrl+U
        if (e.ctrlKey && (key === 'U' || key === 85)) {
          e.preventDefault();
          return false;
        }
      });

      // บล็อคคลิกขวา
      document.addEventListener('contextmenu', function (e) {
        e.preventDefault();
      });
    })();
  </script>

<body>
  <noscript>
    <div style="text-align: center; padding: 50px; font-family: sans-serif;">
      <h1>Chaoperty</h1>
      <p>กรุณาเปิดใช้งาน JavaScript เพื่อใช้งานระบบ</p>
      <p>Please enable JavaScript to use this application.</p>
    </div>
  </noscript>
  
  <script>
    // ป้องกัน LINE WebView pull-to-dismiss และ iOS Safari overscroll
    // ต้องใช้ passive: false เพื่อให้ preventDefault() ทำงานได้
    document.addEventListener('touchmove', function (e) {
      e.preventDefault();
    }, { passive: false });

    // ป้องกัน double-tap zoom บน iOS
    var lastTouchEnd = 0;
    document.addEventListener('touchend', function (e) {
      var now = Date.now();
      if (now - lastTouchEnd < 300) {
        e.preventDefault();
      }
      lastTouchEnd = now;
    }, { passive: false });
  </script>

  <script>
    (function () {
      if (!('serviceWorker' in navigator)) {
        window.addEventListener('load', function () { _flutter.loader.load(); });
        return;
      }

      // ทุก session ใหม่ → unregister SW เก่า + ล้าง cache → reload
      // ทำให้แน่ใจว่าได้ version ล่าสุดทุกครั้งที่เปิด LINE ใหม่
      if (!sessionStorage.getItem('_sw_done')) {
        sessionStorage.setItem('_sw_done', '1');

        Promise.all([
          navigator.serviceWorker.getRegistrations().then(function (regs) {
            return Promise.all(regs.map(function (r) { return r.unregister(); }));
          }),
          caches.keys().then(function (names) {
            return Promise.all(names.map(function (n) { return caches.delete(n); }));
          })
        ]).then(function () {
          window.location.reload(true);
        });

        return; // รอ reload — ไม่โหลด Flutter ในรอบนี้
      }

      // reload แล้ว → โหลด Flutter ปกติ
      window.addEventListener('load', function () {
        _flutter.loader.load();
      });
    })();
  </script>
</body>
