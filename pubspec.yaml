  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # Fonts pruned 2026-07-08: removed WorkSans, Roboto, ThaiFont, Pacifico,
  # Bangers, DoHyeon, Righteous, Saysettha, Phetsarath, Loas, NotoSansLaos,
  # NotoSerif, NotoSansLaoRegular, Sarabun* (only referenced by commented-out
  # PDF code). Kept fonts actually used by Color.Fonts_T, fitness_app_theme,
  # and rootBundle.load('fonts/THSarabunNew.ttf') in PDF generators.
  #
  # อ่านก่อนแก้: ในบล็อก fonts: นี้ใส่เฉพาะฟอนต์ที่ "UI ต้องใช้ตอนวาดหน้า"
  # เท่านั้น (ประกาศที่ family แล้ว Flutter จะโหลดทันทีตอนเปิดแอป)
  #
  # ฟอนต์ที่ใช้เฉพาะตอน generate PDF ให้ประกาศใน assets: แทน (ด้านบนของไฟล์)
  # — rootBundle.load() ทำงานเหมือนกัน แต่จะโหลดเมื่อสั่งพิมพ์เท่านั้น
  # ประหยัดเวลาโหลดครั้งแรกบนมือถือ/LINE
  fonts:
    - family: LINESeed1
      fonts:
        - asset: fonts/LINESeedSansTH_XBd.ttf

    - family: LINESeed2
      fonts:
        - asset: fonts/LINESeedSansTH_Rg.ttf

    # THSarabunNew / THSarabunNewBold / NotoSansLao* ย้ายไป assets:
