  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # Fonts pruned 2026-07-08: removed WorkSans, Roboto, ThaiFont, Pacifico,
  # Bangers, DoHyeon, Righteous, Saysettha, Phetsarath, Loas, NotoSansLaos,
  # NotoSerif, NotoSansLaoRegular, Sarabun* (only referenced by commented-out
  # PDF code). Kept fonts actually used by Color.Fonts_T, fitness_app_theme,
  # and rootBundle.load('fonts/THSarabunNew.ttf') in PDF generators.
  fonts:
    - family: LINESeed1
      fonts:
        - asset: fonts/LINESeedSansTH_XBd.ttf

    - family: LINESeed2
      fonts:
        - asset: fonts/LINESeedSansTH_Rg.ttf

    - family: THSarabunNew
      fonts:
        - asset: fonts/THSarabunNew.ttf
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/custom-fonts/#from-packages
