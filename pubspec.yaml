  # To add assets to your application, add an assets section, like this:
  # Pruned 2026-07-08: removed unused TP1-TP4_1, card/, LogoBank/ roots,
  # assets/images/ root (replaced with LogoBank/ subfolder only), images/
  # root replaced with explicit files actually referenced by code.
  #
  # Pruned 2026-09-17: ปิด asset ที่ grep แล้ว 0 reference ใน lib/ (ประหยัด
  # ~14.2M จาก bundle ของเว็บ) ทุกบรรทัดที่ปิดมีหลักฐานกำกับ — ถ้าภายหลังมี
  # โค้ดใหม่อ้างถึง ให้เปิดกลับ ไม่ต้องลบโฟลเดอร์ทิ้ง
  #   grep -rn "assets/<path>" lib/   → ต้องเจอ ก่อนเปิดกลับ
