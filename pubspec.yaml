    # keep this exact prefix for Flutter web to serve /assets/images/...
    - images/image7-11.png
    - images/Choice_BG_PDF.png
    - images/choice_logo2.png
    # - assets/images/LOGO.png            # 0 refs — โค้ดใช้ images/LOGO.png
    # - assets/images/icon_thaiqr.png     # 0 refs — โค้ดใช้ images/icon_thaiqr.png
    # - assets/images/thai_qr_payment.png # 0 refs
    - assets/images/LogoBank/ # dynamic: 'assets/images/LogoBank/$logoFile' — ห้ามปิด
    # - assets/images/New folder/  # 6.2M  0 refs (Receip_Template, B1_TP* ทั้งหมด)
    # - assets/images/TP1/         # 264K  0 refs
    # - assets/images/TP2/         # 268K  0 refs
    # - assets/images/TP3/         # 408K  0 refs
    # - assets/images/TP4/         # 316K  0 refs
    # - assets/images/TP4_1/       # 892K  0 refs
    # - assets/images/card/        # 8K    0 refs — และมี localhost.key อยู่ในนั้น
    #                              #       ห้าม ship private key ขึ้น web root
    # - assets/design_course/          # 860K  0 refs
    - assets/fitness_app/ # 2.8M  ใช้จริง — ห้ามปิด
