    # - assets/introduction_animation/ # 724K  0 refs

    # ===== ฟอนต์สำหรับ PDF (ย้ายมาจาก fonts: 2026-09-19) =====
    # ประกาศใน fonts: = Flutter โหลดทันทีตอนเปิดแอป (ช้า)
    # ประกาศใน assets: = โหลดเมื่อ rootBundle.load() ถูกเรียก (ตอนสั่งพิมพ์)
    #
    # โค้ดที่เรียก (ใช้ rootBundle.load('fonts/...') ทั้งหมด):
    #   THSarabunNew.ttf        — fonts_pdf default ใน Man_*.dart 8 ไฟล์
    #                             + pdf_*.dart ที่ยัง active ~10 ไฟล์
    #   THSarabunNewBold.ttf    — pdf_AC_his_statusbill_80MM.dart:95,
    #                             pdf_BillingNote_IV_80MM.dart:95
    #   NotoSansLao.ttf         — fonts_pdf ตอน rt_Language == 'LA' (6 ไฟล์)
    #   NotoSansLao-Regular.ttf — เหมือนข้างบน แต่อีก 2 ไฟล์เรียกชื่อนี้
    #
    # ห้ามลบบรรทัดใดบรรทัดหนึ่งโดยไม่ grep หา call site ก่อน ไม่งั้นตอนพิมพ์
    # PDF จะ crash 'Unable to load asset'
    - fonts/THSarabunNew.ttf
    - fonts/THSarabunNewBold.ttf
    - fonts/NotoSansLao.ttf
    - fonts/NotoSansLao-Regular.ttf

